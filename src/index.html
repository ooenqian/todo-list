<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">

        <header class="app-header">
            <div class="logo">✓</div>
            <h1>To-Do List</h1>
        </header>

        <section class="task-section">
            <div class="task-section-header">
                <h2>My List</h2>

                <div class="header-actions">
                    <button id="addTask" class="add-button">
                        + Add Task
                    </button>

                    <select id="taskFilter" aria-label="Filter tasks">
                        <option value="All">All Tasks</option>
                        <option value="Pending">Pending</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
            </div>

            <div id="taskList" class="task-list"></div>

            <p id="emptyMessage" class="empty-message">No tasks yet. Add your first task above!</p>
        </section>

        <footer>
            <p>To-Do List | Created 2026</p>
        </footer>
    </div>

    <!-- Add / Edit Task Popup -->
    <div id="taskModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="formHeading">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="formHeading">Add Task</h2>
                <button type="button" id="closeModal" class="close-button" aria-label="Close popup">&times;</button>
            </div>

            <form id="taskForm">

                <label for="taskTitle">Task Title *</label>
                <input type="text" id="taskTitle" placeholder="Enter task title" maxlength="100" required>

                <label for="taskDescription">Description</label>
                <textarea id="taskDescription" placeholder="Enter task description" rows="4" maxlength="1000"></textarea>

                <label for="taskPriority">Priority</label>
                <select id="taskPriority">
                    <option value="High">High</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="Low">Low</option>
                </select>

                <div class="form-buttons">
                    <button type="submit" id="saveButton" class="add-button">Add Task</button>

                    <button type="button" id="cancelButton" class="cancel-button">Cancel</button>
                </div>

            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
